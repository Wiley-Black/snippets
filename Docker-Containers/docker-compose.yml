services:
  mine:
    build: mine
    image: mine:latest
    
    # Make some storage from outside of the container available within the container.
    # Changes made here from inside the container will persist beyond the container lifetime.
    volumes:
      - type: bind
        source: H:\
        target: /mnt/persist

    # Connect using Remote Desktop to localhost:3390.
    ports:
      - "3390:3389"

    # To do interactive troubleshooting:
    #   docker compose run --rm ubuntu bash
    stdin_open: true # Equivalent to docker run -i
    tty: true        # Equivalent to docker run -t
    